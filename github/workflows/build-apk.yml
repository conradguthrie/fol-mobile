name: Build Fast One Logistics APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Extract mobile project
        run: |
          unzip -o Fast-One-Logistics-Mobile-Source-v1.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle -p FOL-Mobile-Starter/android assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Fast-One-Logistics-APK
          path: FOL-Mobile-Starter/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
